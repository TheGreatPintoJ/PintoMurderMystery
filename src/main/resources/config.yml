isolatedplayerlist: false # whether player's not actively playing will show up on the tablist/playerlist
murdermystery: # world name - can be anything
  enabled: false

  spawnlocations:
    - x: 26.5 # XYZ coordinates of the spawn location
      y: 77.1
      z: -15.5
      fx: 0.0 # XZ coordinates for the player to be facing
      fz: 26.5
    - x: -10.5
      y: 71.1
      z: -31.5
      fx: -10.5
      fz: -41.5
    - x: -23.5
      y: 65.1
      z: -22.5
      fx: -13.5
      fz: -22.5

  coinlocations:
    - x: -15.5
      y: 66.0
      z: -22.5
      r: 5

  coinspawnfrequency: 40 # how often a gold will spawn at a random location in ticks. for balancing, this number should be lower corresponding to higher amounts of possible locations
  maxcoins: 200 # how many coins will be allowed to exist before all get cleared

  endlocation: # location that the players will be teleported to after the game
    world: lobby
    x: 0
    y: 64
    z: 0

  graceperiod: 15 # Amount of time between the 'start' of the game and when roles get assigned (in seconds)
  murderers: 2 # Number of murderers in the game
  sheriffs: 2 # Number of sheriffs in the game
  maxplayers: 16 # Number of players the game can hold. Will start automatically when this number is reached
  minplayers: 12 # Number of players to start the countdown for.

  coinstobow: 10 # Number of coins a player needs to get a bow
  bowinstashoot: false # If left-clicking with a bow should shoot instantly with a perfect trajectory
  deathwater: true # If the player takes damage while in water
  wrongguesskills: true # If the sheriff or innocents try shooting a non-murderer, will they die instead of the other innocent?
  timelimit: 600 # At what time the game ends, regardless of murderers dead. in seconds

  knifecooldown: 5 # Cooldown between throwing knife
  knifespeed: 1.0 # Speed of the thrown knife

  candropitems: false # whether players are allowed to drop items

  gamerules: # Set boolean gamerules
    fallDamage: false

  # If you want these values to stick for the duration of the game, set advance_time and advance_weather to false in gamerules above
  timeofday: 18000 # Time of day in ticks (0:sunrise, 1k:morning, 6k:noon, 12k:sunset, 13k:night, 18k:midnight, 23k:dawn)
  weather: thunder # Weather (clear, rain, thunder)